aid: bianhuakai-club
name: OPC / 彼岸花开
description: >-
  OPC / 彼岸花开 is a one-person company (OPC) operated by Lei Zhang in Hangzhou, China. Its
  agent-facing surface is a single A2A agent, "China On-Site Video Service": an agent (or a person)
  supplies a Google Maps link or coordinates for any place in China and Lei travels there and films
  about ten minutes of genuine, unscripted footage - streets, markets, temples, a family's old
  neighborhood - delivered by email as an MP4 for a fixed $50 USD (other requests at $50/hour, paid
  by Wise, Panda Remit or Remitly). The A2A agent card is served from the company's own domain at
  the legacy /.well-known/agent.json path and grades conformant against A2A 1.0.0; the JSON-RPC
  endpoint at /a2a/ is anonymous and live. It is an agent card in front of a human fulfilment
  service, not a software API: there is no OpenAPI, MCP server, SDK, developer documentation or
  developer signup. The site root hosts a separate login-gated Chinese consumer chat app (彼岸花开 · 花灵).
