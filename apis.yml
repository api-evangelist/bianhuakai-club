apis:
- name: China On-Site Video Service (A2A agent)
  description: >-
    A2A agent operated by Lei Zhang: you provide a Google Maps link or coordinates of any place in
    China and a real local goes there and films ~10 minutes of genuine, unscripted everyday footage
    (streets, markets, people, food, atmosphere) - not stock footage - delivered to your email as an
    MP4 attachment. One skill, film_video_at_location. JSON-RPC 2.0 over HTTPS, anonymous; the
    endpoint accepts the task and a human fulfils it, so completion is confirmed by email rather
    than by polling tasks/get. Fixed $50 USD per video, paid by remittance outside the protocol.
  humanURL: https://bianhuakai.club/lei/
